<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15120e"><meta name="apple-mobile-web-app-capable" content="yes"><style>body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>

<style>
/* Layout: one-hand portrait column — status strip, play surface (map / formation / battle), action bar */
:root{
  --ink:#15120e; --lacquer:#221c16; --raise:#2c251d; --line:#41372b;
  --paper:#ece2cb; --muted:#a6987d; --seal:#c4432b; --gold:#cfa851; --jade:#73a58c; --ember:#e07a2f;
  --display:'Song Myung','Nanum Myeongjo','Apple SD Gothic Neo',serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 28px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--raise);padding:10px 14px;border-radius:4px;min-height:44px}
.btn.sm{min-height:34px;padding:4px 10px;font-size:.85rem}
.btn.primary{background:var(--seal);border-color:var(--seal);color:var(--paper);font-family:var(--display);font-size:1.1rem;letter-spacing:.08em}
.btn.on{border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.muted{color:var(--muted)}
.label{font-size:.72rem;letter-spacing:.12em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.title{display:flex;flex-direction:column;gap:20px;padding-block:8vh 0}
.title h1{font-size:3.4rem;line-height:1;letter-spacing:.06em}
.title h1 span{color:var(--seal)}
.seal{display:inline-grid;place-items:center;width:52px;height:52px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-size:1.5rem;transform:rotate(-4deg)}
.title p{margin:0;max-width:32ch}
.field{display:flex;flex-direction:column;gap:6px}
.field input{background:var(--lacquer);border:1px solid var(--line);color:var(--paper);padding:12px;border-radius:4px;font:inherit;font-size:1.1rem}

.status{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;flex-wrap:wrap}
.status .who{font-family:var(--display);font-size:1.25rem}
.chip{font-size:.85rem;color:var(--muted)}
.chip b{color:var(--paper);font-weight:400}
.food{color:var(--seal);letter-spacing:.1em}

.map{position:relative;width:100%;aspect-ratio:3/4;max-width:100%;border:1px solid var(--line);border-radius:4px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,#2a2219 0%,transparent 60%),radial-gradient(90% 60% at 20% 100%,#1d2a22 0%,transparent 70%),var(--lacquer)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map line{stroke:var(--line);stroke-width:.5}
.map line.lit{stroke:var(--gold);stroke-dasharray:1.2 1}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;padding:4px;min-width:44px;min-height:44px}
.node .pin{width:20px;height:20px;border:1.5px solid var(--line);background:var(--ink);transform:rotate(45deg)}
.node .nm{font-family:var(--display);font-size:.88rem;white-space:nowrap}
.node .tr{font-size:.62rem;color:var(--muted);white-space:nowrap}
.node.own .pin{background:var(--gold);border-color:var(--gold)}
.node.open .pin{border-color:var(--seal);background:#3a1912;animation:pulse 1.6s ease-in-out infinite}
.node.far .pin{border-color:var(--ember);border-style:dashed;background:#3a2412}
.node.lock{opacity:.45}
.node.boss .pin{width:26px;height:26px}
.node.mkt .nm::after{content:' 市';color:var(--gold);font-size:.7rem}
.map.using .node.open .pin,.map.using .node.far .pin{border-color:var(--gold);box-shadow:0 0 0 4px rgba(207,168,81,.3)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(196,67,43,.25)}}
.hint{font-size:.88rem;border-left:2px solid var(--gold);padding:6px 10px;background:var(--lacquer)}
.items{display:flex;flex-wrap:wrap;gap:6px}

.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.cell{aspect-ratio:1;border-radius:4px;border:1px dashed var(--line);background:transparent;padding:0;min-width:0}
.cell.off{border:0;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(65,55,43,.5) 6px 7px)}
.cell.lockrow{border:1px dashed #2f281f;background:transparent;opacity:.6;display:grid;place-items:center;font-size:.55rem;color:var(--muted)}
.cell.target{border-color:var(--gold);border-style:solid}
.cell .bdg{display:block;margin-top:58%;text-align:center}
.tile{position:relative;z-index:1;border-radius:4px;background:var(--raise);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;min-width:0;padding:2px}
.tile .nm{font-family:var(--display);font-size:.95rem;line-height:1.1;white-space:nowrap}
.tile .cl{position:absolute;top:2px;left:4px;font-size:.6rem;color:var(--muted)}
.tile .rk{position:absolute;top:2px;right:4px;font-size:.6rem;color:var(--gold)}
.tile .eq{font-size:.58rem;color:var(--gold);white-space:nowrap}
.tile .st{font-size:.62rem;color:var(--muted);white-space:nowrap}
.tile .st b{color:var(--paper);font-weight:400}
.tile.p{border-color:#3d5a4c}
.tile.e{border-color:#5c2a20}
.tile.hero{border-color:var(--gold)}
.tile.sel{outline:2px solid var(--gold);outline-offset:1px}
.tile.buff .st b{color:var(--jade)}
.tile.hidden .nm{color:var(--muted)}
.tile .hp{position:absolute;left:4px;right:4px;bottom:3px;height:3px;background:var(--ink)}
.tile .hp i{display:block;height:100%;background:var(--jade);transition:width .25s}
.tile.e .hp i{background:var(--seal)}
.tile.dead{opacity:.18;filter:grayscale(1)}
.tile.burn{box-shadow:inset 0 -10px 14px -6px var(--ember);border-color:var(--ember)}
.tile.stun .nm{opacity:.5}
.tile.act{transform:scale(1.06);z-index:2;box-shadow:0 0 0 2px var(--gold)}
.tile.hit{animation:shake .25s}
@keyframes shake{30%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
.dmg{position:absolute;top:28%;left:50%;transform:translateX(-50%);font-family:var(--display);color:var(--seal);font-size:1.05rem;pointer-events:none;animation:rise .7s forwards;text-shadow:0 1px 0 var(--ink);z-index:3}
.dmg.fire{color:var(--ember)}
.dmg.heal{color:var(--jade)}
@keyframes rise{to{transform:translate(-50%,-26px);opacity:0}}
.side-label{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.front-mark{font-size:.7rem;color:var(--muted);text-align:center;letter-spacing:.2em}
.bdg{font-size:.58rem;padding:0 4px;border-radius:2px;white-space:nowrap}
.bdg.up{background:var(--jade);color:var(--ink)}.bdg.dn{background:var(--seal);color:var(--paper)}

.bench{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.bench .tile{aspect-ratio:1}
.syn{display:flex;flex-wrap:wrap;gap:6px}
.syn span{font-size:.78rem;border:1px solid var(--line);padding:3px 8px;border-radius:999px;background:var(--lacquer)}
.syn span b{color:var(--gold);font-weight:400;font-family:var(--display)}
.info{background:var(--lacquer);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:.88rem}
.info h3{font-size:1.1rem}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:8px;min-height:40px;font-family:var(--display)}
.seg button.on{background:var(--raise);color:var(--gold)}
.cond{display:flex;gap:6px;flex-wrap:wrap}
.cond span{font-size:.78rem;padding:2px 8px;border:1px solid var(--line);border-radius:3px}
.cond .good{border-color:var(--jade);color:var(--jade)}
.cond .bad{border-color:var(--seal);color:#e88a77}

.log{font-size:.82rem;color:var(--muted);min-height:2.6em;text-align:center}
.vs{display:flex;flex-direction:column;gap:6px}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.card{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--raise);border-radius:5px;padding:6px 8px;min-height:76px}

.card small{font-size:.68rem;color:var(--muted);line-height:1.3}
.card .cost{color:var(--gold);font-size:.7rem}
.card:disabled{opacity:.35}
.cmd{color:var(--gold);letter-spacing:.15em}

.sheet{position:fixed;inset:0;background:rgba(10,8,6,.72);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .panel{background:var(--lacquer);border-top:1px solid var(--line);width:100%;max-width:480px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;border-radius:10px 10px 0 0;max-height:88vh;overflow:auto}
.sheet h2{font-size:1.6rem}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.picks .btn,.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.picks .btn b,.opt b{font-family:var(--display);font-weight:400;font-size:1.05rem}
.list{display:flex;flex-direction:column;gap:8px}
.gen{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--lacquer);border:1px solid var(--line);border-radius:4px;padding:8px}
.gen .tile{aspect-ratio:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:4px;font-size:.9rem;z-index:20;max-width:90%}
h3.sec{font-size:1.15rem;border-bottom:1px solid var(--line);padding-bottom:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function behind(a,b){return a.r+a.h===b.r&&colOverlap(a,b)}

      hurt(f,u.atk*(u.c==='궁'?1:.7)*rnd()*(ADV(u.c,f.c)?1.4:1)*terMult(u)*(B.weather==='비'?.7:1)*(f.shield?.6:1),hits,'arrow');

function runRound(){

function check(){if(B.over)return;if(!alive('e').length)B.over='win';else if(!alive('p').length)B.over='lose'}

  const lines=EDGES.map(([a,b])=>{const A=NODES[a],Bn=NODES[b];return `<line x1="${A.x}" y1="${A.y*4/3}" x2="${Bn.x}" y2="${Bn.y*4/3}" class="${S.owned.includes(a)&&S.owned.includes(b)?'lit':''}"/>`}).join('');
  const nodes=NODES.map(n=>{const own=S.owned.includes(n.id),cls=own?'own':open.has(n.id)?'open':far.has(n.id)?'far':'lock';
    let sub='';if(!own&&cls!=='lock'){const c=cond(n.id);sub=`${n.boss?'최종':'難'+n.t} · ${c.weather} · ${WIND[c.wind]}`}else if(!own&&n.t)sub=n.boss?'최종':'難'+n.t;
    return `<button class="node ${cls}${n.boss?' boss':''}${n.mkt?' mkt':''}" style="left:${n.x}%;top:${n.y}%" data-n="${n.id}" ${cls==='open'||cls==='far'?'':'tabindex="-1"'}>
      <span class="pin"></span><span class="nm">${n.n}${S.mods[n.id]?' ✦':''}</span>${sub?`<span class="tr">${sub}</span>`:''}</button>`}).join('');
  const inv={};S.mapi.forEach(x=>inv[x]=(inv[x]||0)+1);
  const toRow=ROW4_AT-S.owned.length;
  $('#app').innerHTML=`${statusHTML()}
    ${ui.use?`<div class="hint">「${ui.use}」을(를) 쓸 고을을 고르세요. <button class="btn sm" id="cancel">취소</button></div>`:S.hint?`<div class="hint">붉게 빛나는 고을을 눌러 공략하세요. 고을마다 지형·날씨·바람이 다르고, 순풍일 때 화공이 강합니다. 날씨가 나쁘면 금 15를 내고 하루 기다릴 수 있습니다.</div>`:''}
    <div class="map${ui.use?' using':''}"><svg viewBox="0 0 100 133.3" preserveAspectRatio="none">${lines}</svg>${nodes}</div>
    <div class="label">진영 ${rowsOpen()}열${toRow>0?` · 고을 ${toRow}개를 더 점령하면 4열이 열립니다`:' · 최대'}</div>
    <div class="side-label"><span class="label">지도 아이템</span>${S.march?'<span class="label" style="color:var(--ember)">강행군 준비됨</span>':''}</div>
    <div class="items">${Object.keys(inv).length?Object.entries(inv).map(([k,v])=>`<button class="btn sm" data-mi="${esc(k)}">${k}${v>1?' ×'+v:''}</button>`).join(''):'<span class="muted">없음</span>'}</div>
    <div class="row"><button class="btn grow" id="camp">군영 · 장수 ${Object.keys(S.roster).length+1}명</button><button class="btn" id="wait" ${S.gold<15?'disabled':''}>하루 기다리기 · 금15</button></div>
    <button class="btn" id="quit">처음으로</button>`;
  document.querySelectorAll('.node.open,.node.far').forEach(b=>b.onclick=()=>{const id=+b.dataset.n;if(ui.use)return useItemOn(id);nodeSheet(NODES[id])});
  document.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>{const k=b.dataset.mi;
    if(MI[k].target){ui.use=k;return go(renderMap)}
    const d=sheet(`<h2>${k}</h2><div class="info">${MI[k].d}</div><button class="btn primary" id="use">사용</button>`);
    d.querySelector('#use').onclick=()=>{
      if(k==='군량'){if(S.food>=5)return toast('병량이 이미 가득합니다');S.food++}
      if(k==='강행군')S.march=true;
      S.mapi.splice(S.mapi.indexOf(k),1);d.remove();toast(`${k} 사용`);go(renderMap)}});
  if($('#cancel'))$('#cancel').onclick=()=>{ui.use=null;go(renderMap)};
  $('#camp').onclick=()=>go(renderCamp);
  $('#wait').onclick=()=>{S.gold-=15;S.day++;refreshShop();toast('하루가 지나 날씨와 바람이 바뀌었습니다');go(renderMap)};
  $('#quit').onclick=()=>go(renderTitle);
}
function useItemOn(id){const k=ui.use,c=cond(id);
  if(k==='화공 수레'&&c.weather==='비'){toast('비가 와서 화공 수레를 쓸 수 없습니다');return}
  S.mods[id]=S.mods[id]||{};S.mods[id][k==='화공 수레'?'cart':k==='첩자'?'spy':'sow']=k==='첩자'?1+Math.floor(Math.random()*9):1;
  S.mapi.splice(S.mapi.indexOf(k),1);ui.use=null;toast(`${NODES[id].n}에 ${k}을(를) 썼습니다`);go(renderMap)}
function nodeSheet(node){
  const E=enemyArmy(node),r=node.r||{},c=cond(node.id),m=S.mods[node.id]||{};
  const rw=node.boss?'천하를 손에 넣습니다':r.g?`<b>${r.g}</b> 합류`+(S.roster[r.g]?' (이미 있으면 단련 +1)':''):`금 ${r.gold}`;
  const d=sheet(`<div class="side-label"><h2>${node.n}</h2><span class="label">${node.boss?'최종 결전':'난이도 '+node.t}</span></div>
    ${condHTML(c)}
    ${gridHTML(E,'e',null,{fog:c.weather==='안개'})}<div class="front-mark">▼ 적 전열</div>
    ${Object.keys(m).length?`<div class="info">준비된 계략: ${[m.cart&&'화공 수레',m.spy&&'첩자',m.sow&&'이간계'].filter(Boolean).join(', ')}</div>`:''}
    <div class="info">승리 보상: ${rw} · 금 ${15+10*node.t} · 경험 ${20+15*node.t} · 전리품 3개 중 1개 · 살아남은 장수 전공</div>
    <div class="row"><button class="btn grow" id="x">물러나기</button><button class="btn primary grow" id="f">진형 편성</button></div>`);
  d.querySelector('#x').onclick=()=>d.remove();
  d.querySelector('#f').onclick=()=>{d.remove();S.hint=false;ui.sel=null;ui.rot=0;go(renderForm,node.id)};
}
function renderForm(nid){
  sanitize();
  const node=NODES[nid],M=maskOf(),{units,syn}=computeArmy(),E=enemyArmy(node),c=cond(nid);
  const ids=['hero',...Object.keys(S.roster)],bench=ids.filter(i=>!S.place[i]).map(i=>({id:i,...unitBase(i)}));
  const sel=ui.sel,selB=sel?unitBase(sel):null;
  const info=sel?(()=>{const u=units.find(x=>x.id===sel)||{id:sel,...selB},s=selB.sz;
    return `<h3>${esc(u.name)} <span class="label">${u.hero?'주인공 · ':''}${CLS[u.c]} · ${s[0]*s[1]}칸</span></h3>
      <div class="num">공격 ${u.atk} · 체력 ${u.maxhp??u.hp} · 속도 ${u.spd}${u.int?` · 지력 ${u.int}`:''}${u.item?` · 장비 ${u.item}`:''}${u.sk&&u.sk.length?` · 기술 ${u.sk.join(', ')}`:''}</div><div class="muted">${HINT[sel]||''}</div>
      ${s[0]!==s[1]?`<div class="row" style="margin-top:6px"><button class="btn sm" id="rot">회전 · 지금 ${dims(sel,S.place[sel]?S.place[sel].rot:ui.rot).join('×')}</button><span class="muted" style="font-size:.78rem">가로는 두 열을 막고, 세로는 뒤를 지킵니다</span></div>`:''}`})()
    :`<span class="muted">장수를 누른 뒤 칸을 누르면 그 칸을 왼쪽 위 기준으로 배치됩니다. 큰 장수는 통솔을 칸 수만큼 씁니다. 배치된 장수를 두 번 누르면 대기로 돌아갑니다.</span>`;
  $('#app').innerHTML=`${statusHTML()}
    <div class="side-label"><h2>${node.n}</h2><span class="label">적 ${E.length}부대</span></div>
    ${condHTML(c)}
    ${gridHTML(E,'e',null,{fog:c.weather==='안개'})}
    <div class="front-mark">▲ 아군 전열 ▲</div>
    ${gridHTML(units,'p',M,{target:!!sel,selId:sel,adv:sel?{c:selB.c,foes:E}:null})}
    <div class="seg">${Object.keys(FORMS).map(f=>`<button class="${f===S.form?'on':''}" data-f="${f}">${f}</button>`).join('')}</div>
    <div class="label">상성 +40% · 보병→기병 · 기병→궁병·책사 · 궁병→보병 · 근접은 맞은편 열을 먼저 칩니다</div>
    <div class="syn">${syn.map(s=>`<span><b>${s.n}</b> ${s.d}</span>`).join('')}</div>
    <div class="side-label"><span class="label">대기</span><span class="label num">통솔 ${used()}/${cap()}</span></div>
    <div class="bench">${bench.map(u=>tileHTML(u,'p',{sel:sel===u.id})).join('')||'<span class="muted">모두 출진</span>'}</div>
    <div class="info">${info}</div>
    <div class="row"><button class="btn" id="back">지도</button><button class="btn primary grow" id="go" ${units.length?'':'disabled'}>출진</button></div>`;
  const pg=document.querySelectorAll('.grid')[1];
  pg.querySelectorAll('.cell').forEach(el=>el.onclick=()=>{if(!sel)return;
    const [r,cc]=el.dataset.k.split(',').map(Number),rot=S.place[sel]?S.place[sel].rot:(ui.rot||0);
    if(!fits(sel,r,cc,rot))return toast(r>=rowsOpen()?'아직 잠긴 줄입니다':'그 자리에는 들어가지 않습니다');
    const [w,h]=dims(sel,rot),occ=occMap(sel),hit=new Set(cellsAt(r,cc,w,h).map(([a,b])=>occ[a+','+b]).filter(Boolean));
    const add=S.place[sel]?0:sizeOf(sel),freed=[...hit].reduce((s,id)=>s+sizeOf(id),0);
    if(used()+add-freed>cap())return toast(`통솔 한도 ${cap()}. 레벨이 오르면 늘어납니다`);
    const prev=S.place[sel];hit.forEach(id=>delete S.place[id]);
    if(prev&&hit.size===1){const o=[...hit][0];if(sizeOf(o)===1&&sizeOf(sel)===1&&fits(o,prev.r,prev.c,0))S.place[o]={r:prev.r,c:prev.c,rot:0}}
    S.place[sel]={r,c:cc,rot};ui.sel=null;go(renderForm,nid)});
  pg.querySelectorAll('.tile').forEach(el=>el.onclick=e=>{e.stopPropagation();const id=el.dataset.u;
    if(sel===id){delete S.place[id];ui.sel=null}else ui.sel=id;go(renderForm,nid)});
  document.querySelectorAll('.bench .tile').forEach(el=>el.onclick=()=>{const id=el.dataset.u;ui.sel=sel===id?null:id;ui.rot=0;go(renderForm,nid)});
  if($('#rot'))$('#rot').onclick=()=>{if(S.place[sel]){const p=S.place[sel],nr=p.rot?0:1;
      if(!fits(sel,p.r,p.c,nr))return toast('회전하면 칸을 벗어납니다');
      const occ=occMap(sel),[w,h]=dims(sel,nr);if(cellsAt(p.r,p.c,w,h).some(([a,b])=>occ[a+','+b]))return toast('회전할 공간이 없습니다');p.rot=nr}
    else ui.rot=ui.rot?0:1;go(renderForm,nid)};
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.form=b.dataset.f;sanitize();go(renderForm,nid)});
  $('#back').onclick=()=>go(renderMap);
  $('#go').onclick=()=>{if(!openNodes().has(nid))S.march=false;S.battles++;save();renderBattle(nid)};
}

function enemyIntent(){
  const foes=alive('p');if(!foes.length)return ['아군이 없습니다'];
  return alive('e').sort((a,b)=>b.spd-a.spd).map(u=>{
    if(u.stun)return `${u.name}: 행동 불가 (${u.stun}합)`;
    const rel=u.r-front('e'),melee=rel===0||(rel===1&&u.c==='기'&&B.ter!=='강');
    if(u.c==='책')return `${u.name}: 아군 전열 전체 화계${B.weather==='비'?' (비 · 위력 감소)':''}`;
    if(u.c==='궁')return `${u.name}: ${arrowTarget(foes).name} 저격${B.weather==='안개'?' (명중 70%)':''}`;
    if(!melee)return `${u.name}: 후열 대기`;
    return `${u.name}: ${meleeTargets(u,foes).map(f=>f.name).join('·')} 공격`;
  });
}
// ---------- battle screen ----------
function renderBattle(nid,resumed=false){
  const node=NODES[nid],pre=resumed?[]:startBattle(node);save();
  const P=B.units.filter(u=>u.side==='p'),E=B.units.filter(u=>u.side==='e');
  $('#app').innerHTML=`${statusHTML()}<div class="vs">
    <div class="side-label"><h2>${node.n}</h2><span class="label" id="rd">준비</span></div>
    <div class="cond" id="cnd"></div><div class="info" id="intent" aria-live="polite"></div>
    ${gridHTML(E,'e',null,{battle:true})}<div class="log" id="log">카드를 내고 「합 진행」을 누르세요</div>
    ${gridHTML(P,'p',maskOf(),{battle:true})}</div>
    <div class="side-label"><span class="label">계책 · 군령 <span class="cmd" id="cmd"></span></span><span class="label num" id="pile"></span></div>
    <div class="hint">매 합 손패 4장 · 한 장을 보관하면 나머지는 버립니다. 대상 카드는 선택 후 사용합니다.</div>
    <div class="hand" id="hand"></div><div class="info" id="target" hidden></div>
    <div class="row"><button class="btn primary grow" id="next">합 진행</button><button class="btn" id="auto">자동</button><button class="btn" id="skip">결과</button></div>`;
  const names=Object.fromEntries(B.units.map(u=>[u.id,u.name]));
  const T=id=>document.querySelector(`.tile[data-u="${CSS.escape(id)}"]`);
  let queue=[...pre],busy=false,speed=1,timer=null,done=false,pendingCard=null;
  const sync=()=>{B.units.forEach(u=>{const t=T(u.id);if(!t)return;t.querySelector('.hp i').style.width=(100*u.hp/u.maxhp)+'%';
    t.classList.toggle('dead',u.hp<=0);t.classList.toggle('burn',u.hp>0&&u.burn>0);t.classList.toggle('stun',u.hp>0&&u.stun>0)})};
  const head=()=>{const nx=B.round+1,p=nx>=4&&nx>B.lock?Math.round(100*Math.min(.4,.1+.05*(nx-4))):0;
    $('#rd').textContent=B.round?B.round+'합':'준비';
    $('#cnd').innerHTML=`<span>${B.ter}</span><span class="${B.weather==='비'?'bad':''}">${B.weather}</span><span class="${B.wind>0?'good':B.wind<0?'bad':''}">${WIND[B.wind]}</span><span>${p?`다음 합 바람 변화 ${p}%`:`바람 고정 ${Math.max(1,Math.max(B.lock,3)-B.round)}합`}</span>`;
    $('#cmd').textContent='◆'.repeat(B.cmd)+'◇'.repeat(Math.max(0,4-B.cmd));
    $('#pile').textContent=`덱 ${B.draw.length} · 버림 ${B.disc.length}`;
    $('#intent').innerHTML=`<b>다음 합 적 행동</b><div class="muted">${enemyIntent().map(esc).join('<br>')}</div><div class="label">현재 배치 기준 · 앞선 처치·교대에 따라 대상 변경 · 연쇄 ${B.chainCount||0}회</div>`;
    $('#hand').innerHTML=B.hand.map((c,i)=>`<div><button class="card" data-i="${i}" ${canPlay(c)&&!busy?'':'disabled'}><span class="cost">군령 ${CARDS[c].cost}</span><b>${c}</b><small>${CARDS[c].d}</small></button><button class="btn sm" data-keep="${i}" ${busy?'disabled':''} aria-pressed="${B.keep===i}">${B.keep===i?'✓ 보관':'보관'}</button></div>`).join('')||'<span class="muted">손에 카드가 없습니다</span>';
    document.querySelectorAll('[data-keep]').forEach(b=>b.onclick=()=>{if(busy)return;B.keep=B.keep===+b.dataset.keep?null:+b.dataset.keep;save();head()});
    document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{if(busy)return;const i=+b.dataset.i,c=B.hand[i];
      if(!CARDS[c].target){pendingCard=null;$('#target').hidden=true;use(i);return}
      pendingCard=i;const options=CARDS[c].target==='swap'?swapPairs().map(p=>({id:p.map(u=>u.id).join('|'),name:p.map(u=>u.name).join(' ↔ ')})):(CARDS[c].target==='ally'?alive('p').filter(u=>!u.stun):alive('e'));
      $('#target').hidden=false;$('#target').innerHTML=`<b>${c} · 대상 선택</b><div class="row">${options.map(u=>`<button class="btn sm" data-target="${esc(u.id)}">${esc(u.name)}</button>`).join('')}<button class="btn sm" id="cancel-card">취소</button></div>`;
      $('#cancel-card').onclick=()=>{pendingCard=null;$('#target').hidden=true};
      document.querySelectorAll('[data-target]').forEach(t=>t.onclick=()=>{const i=pendingCard;pendingCard=null;$('#target').hidden=true;use(i,t.dataset.target)})});
    $('#next').disabled=busy||!!B.over;$('#auto').classList.toggle('on',B.auto)};
  const use=(i,target)=>{if(busy||i==null)return;const ev=playCard(i,target);
    const pg=document.querySelectorAll('.grid')[1];pg.outerHTML=gridHTML(B.units.filter(u=>u.side==='p'),'p',maskOf(),{battle:true});queue.push(...ev);play()};
  const show=e=>{
    document.querySelectorAll('.tile.act').forEach(t=>t.classList.remove('act'));
    if(e.t==='round'){head();return 0}
    if(e.t==='note'){$('#log').textContent=e.x;return 1}
    const s=e.src&&T(e.src);if(s)s.classList.add('act');if(e.from){const from=T(e.from);if(from)from.classList.add('act')}
    const dm=e.hits.filter(h=>h.d);
    $('#log').textContent=(e.x||'')+(dm.length?' → '+dm.map(h=>names[h.id]+(h.heal?' +':' ')+h.d).join(', '):'');
    e.hits.forEach(h=>{const t=T(h.id);if(!t)return;
      if(h.hp!=null){t.querySelector('.hp i').style.width=(100*h.hp/h.max)+'%';if(h.hp<=0)t.classList.add('dead')}
      if(h.burn===1)t.classList.add('burn');if(h.burn===-1)t.classList.remove('burn');if(h.stun)t.classList.add('stun');
      if(h.d){t.classList.remove('hit');void t.offsetWidth;if(!h.heal)t.classList.add('hit');
        const f=document.createElement('span');f.className='dmg'+(h.heal?' heal':e.k==='fire'?' fire':'');f.textContent=(h.heal?'+':'−')+h.d;t.appendChild(f);setTimeout(()=>f.remove(),700)}});
    return 1};
  const play=()=>{if(busy)return;busy=true;head();
    const step=()=>{if(!queue.length){busy=false;sync();head();
        if(B.over)return finish();if(B.auto)timer=setTimeout(()=>{if(!B||B.over)return;queue.push(...runRound());play()},300/speed);return}
      const w=show(queue.shift());timer=setTimeout(step,w?480/speed:0)};
    step()};
  const finish=()=>{if(done)return;done=true;clearTimeout(timer);const win=B.over==='win',surv=alive('p').map(u=>u.id);setTimeout(()=>result(node,win,surv),500)};
  $('#next').onclick=()=>{if(busy||B.over)return;pendingCard=null;$('#target').hidden=true;queue.push(...runRound());play()};
  $('#auto').onclick=()=>{pendingCard=null;$('#target').hidden=true;B.auto=!B.auto;speed=B.auto?2:1;head();if(B.auto&&!busy&&!B.over){queue.push(...runRound());play()}};
  $('#skip').onclick=()=>{pendingCard=null;$('#target').hidden=true;clearTimeout(timer);queue=[];let g=0;while(!B.over&&g++<40)runRound();busy=false;sync();head();finish()};
  head();play();
}

// ---------- rewards & growth ----------
const EQ_POOL=()=>Object.keys(EQ).filter(k=>k!=='적토마');
const CARD_POOL=()=>Object.keys(CARDS).filter(k=>!['동남풍','일기토','미인계','장판교 고함'].includes(k));
function lootOptions(){return [{k:'eq',n:pick(EQ_POOL())},{k:'mi',n:pick(Object.keys(MI))},{k:'card',n:pick(CARD_POOL())}]}
function grant(o){if(o.k==='eq')S.inv.push(o.n);else if(o.k==='mi')S.mapi.push(o.n);else S.deck.push(o.n)}
const optHTML=o=>`<b>${o.n}</b><span class="label">${o.k==='eq'?'장비':o.k==='mi'?'지도 아이템':'계책 카드 · 군령 '+CARDS[o.n].cost}</span><span class="muted" style="font-size:.8rem">${o.k==='eq'?EQ[o.n].d:o.k==='mi'?MI[o.n].d:CARDS[o.n].d}</span>`;
function result(node,win,surv){
  S.lastChain=B?B.chainCount||0:0;B=null;S.battle=null;
  if(win){
    S.owned.push(node.id);const g=15+10*node.t,x=20+15*node.t;S.gold+=g;S.hero.exp+=x;
    let rw='';const r=node.r||{};
    if(r.g){if(S.roster[r.g]){S.roster[r.g]=Math.min(3,S.roster[r.g]+1);rw=`${r.g} 단련 +1`}else{S.roster[r.g]=1;rw=`${r.g} 합류!`;if(CARD_OF[r.g]){S.deck.push(CARD_OF[r.g]);rw+=` 덱에 「${CARD_OF[r.g]}」 추가`}}}
    if(r.gold){S.gold+=r.gold;rw=`금 ${r.gold}`}
    if(r.item){S.inv.push(r.item);rw+=` · ${r.item} 획득`}
    if(node.mkt)refreshShop();
    if(S.owned.length===ROW4_AT)rw+=(rw?'<br>':'')+'진영이 넓어져 4열이 열렸습니다';
    // 전공: 살아남은 장수
    const vx=15+5*node.t,vets=[];
    surv.filter(id=>id!=='hero').forEach(id=>{const v=vetOf(id);v.xp+=vx;while(v.xp>=vetNeed(v.lv)){v.xp-=vetNeed(v.lv);v.lv++;vets.push(id)}});
    const ups=[];while(S.hero.exp>=need(S.hero.lv)){S.hero.exp-=need(S.hero.lv);S.hero.lv++;ups.push(S.hero.lv)}
    if(node.boss){S.end='win';save();return go(renderEnd)}
    S.pending={opts:lootOptions(),loot:true,ups:ups.length,vets:[...vets],title:node.n+' 함락',summary:`${rw?rw+' · ':''}금 +${g} · 경험 +${x} · 연쇄 ${S.lastChain||0}회`};
    save();resumeRewards();
  }else{
    S.food--;S.losses++;
    surv.filter(id=>id!=='hero').forEach(id=>{vetOf(id).xp+=5});
    if(S.food<=0){S.end='lose';save();return go(renderEnd)}
    save();
    const d=sheet(`<h2>패퇴</h2><div class="info">병량을 하나 잃었습니다. 남은 병량 ${S.food}. 날씨를 기다리거나, 진형을 바꾸거나, 군영에서 장수를 단련해 다시 도전하세요.</div><button class="btn primary" id="ok">지도로</button>`,false);
    d.querySelector('#ok').onclick=()=>{d.remove();go(renderMap)};
  }
}
function resumeRewards(){
  const q=S.pending;if(!q)return;
  if(q.loot){const d=sheet(`<h2>${q.title}</h2><div class="info">${q.summary}</div><span class="label">전리품 하나 선택</span><div class="list">${q.opts.map((o,i)=>`<button class="btn opt" data-o="${i}">${optHTML(o)}</button>`).join('')}</div><button class="btn" id="none">고르지 않음</button>`,false);
    const next=()=>{q.loot=false;d.remove();save();resumeRewards()};d.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{grant(q.opts[+b.dataset.o]);next()});d.querySelector('#none').onclick=next;return}
  if(q.ups){levelUp(q.ups,()=>{q.ups--;save();resumeRewards()});return}
  if(q.vets.length){vetUp(q.vets[0],()=>{q.vets.shift();save();resumeRewards()});return}
  delete S.pending;go(renderMap);
}
function levelUp(n,cont){
  const opts=[['atk',3,'무력','전열에서 주는 피해'],['int',3,'지력','8 이상이면 후열 계략'],['spd',1,'속도','먼저 행동'],['hp',15,'체력','오래 버팀']];
  const d=sheet(`<h2>${esc(S.hero.name)} Lv ${S.hero.lv-n+1}</h2><p class="muted" style="margin:0">하나를 골라 단련합니다. 통솔도 1 늘었습니다.</p>
    <div class="picks">${opts.map(([k,v,l,s])=>`<button class="btn" data-k="${k}"><b>${l} +${v}</b><span class="muted">${S.hero[k]} → ${S.hero[k]+v} · ${s}</span></button>`).join('')}</div>`,false);
  d.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const o=opts.find(x=>x[0]===b.dataset.k);S.hero[o[0]]+=o[1];d.remove();cont()});
}
function vetUp(id,cont){
  const v=vetOf(id),c=DEFS[id].c;
  const pool=Object.keys(SKILLS).filter(s=>!v.sk.includes(s)&&(!SKILLS[s].cls||SKILLS[s].cls.includes(c)));
  const sks=shuffle(pool).slice(0,2);
  const opts=[{k:'atk',n:'무력 +2',a:2},{k:'int',n:'지력 +2',a:2},{k:'hp',n:'체력 +12',a:12},...sks.map(s=>({k:'sk',n:s}))];
  const d=sheet(`<h2>${id} · 전공 ★${v.lv}</h2><p class="muted" style="margin:0">전투에서 살아남아 성장합니다. 능력치나 기술 하나를 고르세요.</p>
    <div class="picks">${opts.map((o,i)=>`<button class="btn" data-i="${i}"><b>${o.n}</b><span class="muted">${o.k==='sk'?'기술 · '+SKILLS[o.n].d:'능력치'}</span></button>`).join('')}</div>`,false);
  d.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];if(o.k==='sk')v.sk.push(o.n);else v[o.k]+=o.a;d.remove();cont()});
}

// ---------- camp & market ----------
const hasMarket=()=>NODES.some(n=>n.mkt&&S.owned.includes(n.id));
function refreshShop(){const eq=EQ_POOL(),cards=CARD_POOL();
  S.shop=[{k:'eq',n:pick(eq),p:45},{k:'eq',n:pick(eq),p:45},{k:'mi',n:pick(Object.keys(MI)),p:30},{k:'card',n:pick(cards),p:35}]}
function renderCamp(){
  const h=S.hero,ids=['hero',...Object.keys(S.roster)];
  const rows=ids.map(id=>{const u={id,...unitBase(id)},rk=id==='hero'?0:S.roster[id],cost=25*rk,v=S.vet[id];
    return `<div class="gen">${tileHTML(u,'p')}<div><b style="font-family:var(--display);font-weight:400;font-size:1.05rem">${esc(u.name)}</b> <span class="label">${CLS[u.c]} · ${u.sz[0]*u.sz[1]}칸${id!=='hero'?` · 단련 ${rk}/3`:''}${v?` · 전공 ★${v.lv} (${v.xp}/${vetNeed(v.lv)})`:''}</span>
      <div class="muted" style="font-size:.8rem">${id==='hero'?`무력 ${h.atk} · 지력 ${h.int} · 속도 ${h.spd} · 체력 ${h.hp}. `:''}${v&&v.sk.length?`기술: ${v.sk.map(s=>s+'('+SKILLS[s].d+')').join(', ')}. `:''}${HINT[id]}</div></div>
      <div class="list"><button class="btn sm" data-eq="${esc(id)}">${S.equip[id]?esc(S.equip[id]):'장비 +'}</button>
      ${id!=='hero'?`<button class="btn sm" data-up="${esc(id)}" ${rk>=3||S.gold<cost?'disabled':''}>${rk>=3?'완성':'단련 · '+cost+'금'}</button>`:''}</div></div>`}).join('');
  const dk={};S.deck.forEach(c=>dk[c]=(dk[c]||0)+1);
  const mk=hasMarket();
  $('#app').innerHTML=`${statusHTML()}<h2>군영</h2>
    <span class="label">금으로 장수를 단련합니다 · 단련 1단계마다 공격·체력·지력 +25% · 장비는 장수마다 하나 · ★는 전투에서 살아남아 쌓은 전공</span>
    <div class="list">${rows}</div>
    <h3 class="sec">계책 덱 · ${S.deck.length}장</h3>
    <div class="list">${Object.entries(dk).map(([c,n])=>`<div class="row"><span class="grow"><b style="font-family:var(--display);font-weight:400">${c}</b> ×${n} <span class="muted" style="font-size:.8rem">군령 ${CARDS[c].cost} · ${CARDS[c].d}</span></span>${mk?`<button class="btn sm" data-rm="${esc(c)}" ${S.gold<40||S.deck.length<=4?'disabled':''}>버리기 · 40금</button>`:''}</div>`).join('')}</div>
    <h3 class="sec">시장</h3>
    ${mk?`<div class="list">${S.shop.map((o,i)=>`<button class="btn opt" data-buy="${i}" ${S.gold<o.p?'disabled':''}>${optHTML(o)}<span class="label">금 ${o.p}</span></button>`).join('')||'<span class="muted">물건이 다 팔렸습니다. 하루가 지나면 새로 들어옵니다.</span>'}</div>`
      :'<div class="muted">시장 고을(市 표시: 소패, 완, 장안)을 점령하면 장비·아이템·카드를 사고, 덱에서 카드를 버릴 수 있습니다.</div>'}
    <button class="btn" id="back">지도로</button>`;
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const id=b.dataset.up,c=25*S.roster[id];if(S.gold<c)return;S.gold-=c;S.roster[id]++;go(renderCamp)});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.gold-=40;S.deck.splice(S.deck.indexOf(b.dataset.rm),1);go(renderCamp)});
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const o=S.shop[+b.dataset.buy];if(S.gold<o.p)return;S.gold-=o.p;grant(o);S.shop.splice(+b.dataset.buy,1);toast(`${o.n} 구입`);go(renderCamp)});
  document.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>equipSheet(b.dataset.eq));
  $('#back').onclick=()=>go(renderMap);
}
function equipSheet(id){
  const cur=S.equip[id],inv=[...new Set(S.inv)];
  const d=sheet(`<h2>${esc(id==='hero'?S.hero.name:id)}의 장비</h2>
    ${cur?`<div class="info">지금: <b>${cur}</b> · ${EQ[cur].d}</div><button class="btn" id="off">장비 해제</button>`:''}
    <span class="label">가방</span>
    <div class="list">${inv.length?inv.map(k=>`<button class="btn opt" data-k="${esc(k)}"><b>${k}</b><span class="muted" style="font-size:.8rem">${EQ[k].d}${EQ[k].owner===id?' (주인이 들어 효과 두 배)':''}</span></button>`).join(''):'<span class="muted">가방이 비었습니다. 전리품이나 시장에서 얻으세요.</span>'}</div>`);
  const done=()=>{d.remove();sanitize();go(renderCamp)};
  if(d.querySelector('#off'))d.querySelector('#off').onclick=()=>{S.inv.push(cur);delete S.equip[id];done()};
  d.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;S.inv.splice(S.inv.indexOf(k),1);if(cur)S.inv.push(cur);S.equip[id]=k;done()});
}
function renderEnd(){
  const w=S.end==='win';
  $('#app').innerHTML=`<div class="title"><span class="seal">${w?'天':'敗'}</span><h1>${w?'낙양 입성':'병량 소진'}</h1>
    <p>${w?`${esc(S.hero.name)}의 이름이 천하에 울려 퍼집니다.`:`${esc(S.hero.name)}의 군세가 흩어졌습니다.`}</p>
    <div class="info num">${S.day}일 · 레벨 ${S.hero.lv} · 전투 ${S.battles}회 · 패배 ${S.losses}회 · 고을 ${S.owned.length}/${NODES.length} · 장수 ${Object.keys(S.roster).length+1}명 · 덱 ${S.deck.length}장</div>
    <button class="btn primary" id="again">다시 시작</button></div>`;
  $('#again').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=null;go(renderTitle)};
}

// ---------- boot ----------
function resume(){
  if(S.battle){B=S.battle;return renderBattle(B.node.id,true)}
  go(renderMap);if(S.pending)resumeRewards();
}
function boot(data){if(data&&data.S){S=data.S;resume()}else go(renderTitle)}
window.claude?.hot?.snapshot?.(()=>({S:S&&!S.end&&!B?S:null}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
</body></html>
